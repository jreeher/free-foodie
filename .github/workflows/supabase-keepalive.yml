name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days without activity. This runs a
# few read queries shaped like the app's own (recipe list with tagged
# ingredients, catalog search, ratings) every few days, and doubles as a
# smoke test: the job fails if the database is unreachable or a query errors.
on:
  schedule:
    - cron: '17 14 */3 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Run app-style read queries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          api="$SUPABASE_URL/rest/v1"

          # Vary the catalog search term by day of year
          terms=(rice beans tomato pasta oil pumpkin cheese flour)
          term="${terms[$(( 10#$(date +%j) % ${#terms[@]} ))]}"

          q() {
            echo "GET $1"
            curl -fsS --retry 3 --retry-delay 5 "$api/$1" \
              -H "apikey: $SUPABASE_ANON_KEY" -o /dev/null -w "  -> %{http_code}\n"
            sleep $(( RANDOM % 4 + 1 ))
          }

          q "recipes?select=id,title,skill_level,recipe_food_bank_items(food_bank_items(name))&order=created_at.desc&limit=5"
          q "food_bank_items?select=id,name,category&name=ilike.*${term}*&order=name&limit=10"
          q "recipe_ratings?select=recipe_id,rating&limit=20"
